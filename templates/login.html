<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teto & Altar - Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .login-card {
            max-width: 400px;
            margin: auto;
            margin-top: 10vh;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card login-card p-4">
        <h2 class="text-center mb-4">Teto & Altar 💍🏠</h2>
        
        <div id="error-alert" class="alert alert-danger d-none" role="alert"></div>

        <form id="login-form">
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control form-control-lg" id="email" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control form-control-lg" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-lg">Entrar</button>
        </form>
    </div>
</div>

<script>
    // Adiciona um ouvinte para interceptar o envio do formulário
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault(); // Impede o comportamento padrão (recarregar a página)
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorAlert = document.getElementById('error-alert');

        // Cria os dados de formulário esperados pelo OAuth2 do FastAPI (Form URL Encoded)
        const formData = new URLSearchParams();
        formData.append('username', email);
        formData.append('password', password);

        try {
            // Dispara a requisição de login para a rota /login
            const response = await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString()
            });

            if (response.ok) {
                // Se o login for bem-sucedido, extrai o token JWT
                const data = await response.json();
                // Armazena o token no armazenamento local do navegador para sessões futuras
                localStorage.setItem('teto_token', data.access_token);
                // Redireciona o usuário para a página principal (Dashboard)
                window.location.href = '/app';
            } else {
                // Se as credenciais estiverem erradas, exibe um alerta
                errorAlert.textContent = "Usuário ou senha incorretos!";
                errorAlert.classList.remove('d-none');
            }
        } catch (error) {
            // Se houver algum erro de rede, exibe um alerta de conexão
            errorAlert.textContent = "Erro de conexão com o servidor.";
            errorAlert.classList.remove('d-none');
        }
    });

    // Se o usuário já possuir um token salvo (já estiver logado), redireciona direto para o Dashboard
    if (localStorage.getItem('teto_token')) {
        window.location.href = '/app';
    }
</script>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
