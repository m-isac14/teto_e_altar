version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: teto_altar_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: teto_altar
      MYSQL_USER: teto_user
      MYSQL_PASSWORD: teto_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
